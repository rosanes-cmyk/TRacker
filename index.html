<title>Twin Home Buyer Lead Tracker</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --paper:#0b1312; --surface:#141e1d; --surface-2:#182423; --raised:#1b2726;
  --ink:#e7eeec; --ink-2:#c3d0cd; --muted:#8d9d9a;
  --line:#243331; --line-2:#33433f;
  --accent:#45b7a8; --accent-2:#6fcabd; --accent-ink:#06211e; --accent-soft:#123430;
  --hot:#e09a61; --hot-soft:#33241a;
  --distress:#8fb0e0; --distress-soft:#1b2738;
  --good:#62c28c; --good-soft:#152e21;
  /* funnel ramp: one hue, monotone lightness, not-called -> responded */
  --step1:#2f6660; --step2:#3d8f84; --step3:#52bdad; --step4:#aee4db;
  --warn:#d6a94a; --crit:#e0796c; --crit-soft:#33201d;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -18px rgba(0,0,0,.9);
  --r:8px;
  --sans:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  --cond:"IBM Plex Sans Condensed", "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
body{background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0; font-family:var(--cond); font-weight:700; text-wrap:balance; letter-spacing:-.01em}
a{color:var(--accent); text-decoration-color:color-mix(in srgb, var(--accent) 40%, transparent); text-underline-offset:2px}
button, select, input, textarea{font:inherit; color:inherit}
select{background:var(--surface); color:var(--ink)}
option{background:var(--surface); color:var(--ink)}
option:disabled{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.wrap{max-width:1280px; margin:0 auto; padding-inline:16px}
.topbar{position:sticky; top:0; z-index:30; background:color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
.topbar-in{display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding-block:10px}
.brand{display:flex; align-items:center; gap:10px; margin-right:auto}
.mark{font-family:var(--cond); font-weight:700; font-size:13px; letter-spacing:.06em; color:var(--accent-ink); background:var(--accent); padding:6px 8px; border-radius:6px}
.brandtext{display:flex; flex-direction:column; line-height:1.15}
.brandtext b{font-family:var(--cond); font-size:17px; letter-spacing:-.01em}
.brandtext small{color:var(--muted); font-size:11px; letter-spacing:.09em; text-transform:uppercase}
.tools{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.whoami{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r); padding:3px 4px 3px 9px}
.whoami select{background:var(--surface-2); border:0; font-weight:600; color:var(--ink); padding:3px 2px; border-radius:5px}
.btn{background:var(--surface); border:1px solid var(--line-2); border-radius:var(--r); padding:7px 12px; font-weight:600; font-size:13px; cursor:pointer; transition:background .12s ease, border-color .12s ease}
.btn:hover{background:var(--surface-2); border-color:var(--accent)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2); border-color:var(--accent-2)}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.chip{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:5px 9px; border-radius:100px; border:1px solid var(--line); color:var(--muted); background:var(--surface-2); white-space:nowrap}
.chip .dot{width:7px; height:7px; border-radius:50%; background:currentColor}
.chip.ok{color:var(--good); border-color:color-mix(in srgb, var(--good) 35%, var(--line)); background:var(--good-soft)}
.chip.busy{color:var(--warn); border-color:color-mix(in srgb, var(--warn) 35%, var(--line))}
.chip.bad{color:var(--crit); border-color:color-mix(in srgb, var(--crit) 35%, var(--line)); background:var(--crit-soft)}

.tabs{display:flex; gap:2px; overflow-x:auto; border-bottom:1px solid var(--line); background:var(--surface); scrollbar-width:thin}
.tab{flex:0 0 auto; background:none; border:0; border-bottom:2px solid transparent; padding:11px 14px; font-family:var(--cond); font-size:15px; font-weight:600; color:var(--muted); cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:7px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}
.tab .mine{font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--accent); background:var(--accent-soft); padding:2px 5px; border-radius:4px}
.tab .cov{font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--hot); background:var(--hot-soft); padding:2px 5px; border-radius:4px}
.tab .cnt{font-family:var(--mono); font-size:11px; color:var(--muted); font-weight:500}
.tabnote{align-self:center; padding-left:10px; font-size:12px; color:var(--muted)}

main{padding-block:20px 56px}
.banner{display:flex; gap:10px; align-items:flex-start; padding:10px 13px; border-radius:var(--r); border:1px solid var(--line); background:var(--surface); font-size:13px; color:var(--ink-2); margin-bottom:16px}
.banner b{color:var(--ink)}
.banner.warn{border-color:color-mix(in srgb, var(--warn) 40%, var(--line)); background:color-mix(in srgb, var(--warn) 7%, var(--surface))}

/* ---------- dashboard ---------- */
.sec-head{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:12px}
.sec-head h2{font-size:19px}
.sec-head .sub{color:var(--muted); font-size:12.5px}
.sec-head .btn{margin-left:auto}

/* headline: where the whole file stands */
.cover{border:1px solid var(--line); border-radius:var(--r); background:var(--surface); padding:16px 18px 18px; margin-bottom:10px}
.cover-top{display:flex; align-items:flex-end; gap:20px; flex-wrap:wrap; margin-bottom:16px}
.hero{display:flex; flex-direction:column; gap:1px; margin-right:auto}
.hero .k{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600}
.hero .n{font-size:54px; line-height:1.02; font-weight:600; letter-spacing:-.035em; font-variant-numeric:proportional-nums}
.hero .f{font-size:13px; color:var(--ink-2); margin-top:3px}
.attn{display:flex; gap:7px; flex-wrap:wrap; justify-content:flex-end; padding-bottom:3px}
.note{display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:500; padding:6px 12px; border-radius:100px; border:1px solid var(--line-2); background:var(--surface-2); color:var(--ink-2)}
.note .g{font-size:10px; line-height:1}
.note.warn{color:var(--warn); border-color:color-mix(in srgb, var(--warn) 38%, var(--line))}
.note.bad{color:var(--crit); border-color:color-mix(in srgb, var(--crit) 38%, var(--line)); background:var(--crit-soft)}
.note.ok{color:var(--good); border-color:color-mix(in srgb, var(--good) 35%, var(--line)); background:var(--good-soft)}

.bar{display:flex; gap:2px; height:28px; border-radius:7px; overflow:hidden; margin-bottom:12px}
.bar i{display:block; height:100%}
.legend{display:flex; gap:9px 24px; flex-wrap:wrap}
.lg{display:flex; align-items:center; gap:8px; font-size:12.5px}
.lg .sw{width:11px; height:11px; border-radius:3px; flex:0 0 auto}
.lg .v{font-family:var(--mono); font-weight:600; font-variant-numeric:tabular-nums}
.lg .t{color:var(--muted)}

.tiles{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; margin-bottom:30px}
.tile{background:var(--surface); padding:13px 16px; display:flex; flex-direction:column; gap:2px}
.tile .k{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600}
.tile .v{font-size:27px; font-weight:600; letter-spacing:-.025em; line-height:1.15; font-variant-numeric:proportional-nums}
.tile .f{font-size:12px; color:var(--muted)}

.reps{border:1px solid var(--line); border-radius:var(--r); background:var(--surface); overflow:hidden; margin-bottom:30px}
.reptable{width:100%; min-width:0; border-collapse:collapse}
.reptable th{position:static; padding:8px 14px; border-bottom:0}
.reptable td{padding:11px 14px; border-bottom:0; border-top:1px solid var(--line)}
.reptable th.cov,.reptable td.cov{text-align:left; width:42%}
.reptable tr.total td{background:var(--surface-2); font-weight:600}
.reptable .rep{font-weight:600}
.cov-in{display:flex; align-items:center; gap:11px}
.track{flex:1; min-width:54px; height:8px; border-radius:100px; overflow:hidden; background:color-mix(in srgb, var(--step1) 60%, var(--surface))}
.track i{display:block; height:100%; border-radius:100px; background:var(--step3)}
.covpct{font-family:var(--mono); font-size:12.5px; font-weight:600; font-variant-numeric:tabular-nums; width:38px; text-align:right}
.ago{display:inline-flex; align-items:center; gap:7px; font-size:12px; color:var(--muted)}
.ago .dot{width:7px; height:7px; border-radius:50%; background:currentColor; flex:0 0 auto}
.ago.ok{color:var(--good)}
.ago.warn{color:var(--warn)}
.ago.bad{color:var(--crit)}

.daynav{display:flex; align-items:center; gap:10px; margin-bottom:12px}
.daynav b{font-family:var(--cond); font-size:17px}
.daynav .sub{color:var(--muted); font-size:12.5px}
.daytable td.name{font-weight:600}
.daytable .own{color:var(--muted); font-weight:500}
.daytable .forlist{color:var(--hot); font-weight:600}
.st.worked{color:var(--hot); border-color:color-mix(in srgb, var(--hot) 40%, var(--line)); background:var(--hot-soft)}
.dw{display:flex; flex-direction:column; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.dwrow{display:grid; grid-template-columns:minmax(130px,auto) 62px 1fr auto; gap:16px; align-items:center; padding:11px 16px; background:var(--surface)}
.dwrow.idle{color:var(--muted)}
.dwrow .p{font-weight:600; display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.dwrow.idle .p{font-weight:500}
.dwrow .dots{display:flex; gap:4px}
.dwrow .dots i{width:10px; height:10px; border-radius:3px; background:var(--line-2); display:block}
.dwrow .dots:empty::before{content:'—'; color:var(--muted); font-size:12px}
.dwrow .atleast{color:var(--warn); font-weight:500}
.dwrow .dots i.on{background:var(--step3)}
.dwrow .n{font-family:var(--mono); font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap}
.dwrow .chips{display:flex; gap:5px; flex-wrap:wrap; align-items:center}
.dc{font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:100px; border:1px dashed var(--line-2); color:var(--muted); white-space:nowrap}
.dc.ex{border-style:solid; border-color:color-mix(in srgb, var(--step3) 55%, var(--line)); background:color-mix(in srgb, var(--step3) 16%, var(--surface)); color:var(--step4)}
.dwrow .none{font-size:12.5px; color:var(--muted)}
.dwrow .f{font-size:12.5px; color:var(--muted)}
.dwrow .floor{color:var(--warn)}
.dwnote{color:var(--muted); font-size:12px; margin:10px 0 30px; display:flex; align-items:center; gap:4px; flex-wrap:wrap}
@media (max-width:680px){
  .dwrow{grid-template-columns:1fr auto; row-gap:7px}
  .dwrow .chips{grid-column:1/-1}
  .dwrow .f{grid-column:1/-1}
}
.days{display:flex; flex-direction:column; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; margin-bottom:30px}
.dayrow{display:grid; grid-template-columns:minmax(96px,auto) 1fr 54px; gap:14px; align-items:center; padding:9px 16px; background:var(--surface); cursor:pointer}
.dayrow:hover{background:var(--surface-2)}
.dayrow.on{background:var(--accent-soft)}
.dayrow .dl{font-size:13px}
.dayrow.on .dl{font-weight:600; color:var(--accent)}
.dayrow .db{height:8px; border-radius:100px; background:color-mix(in srgb, var(--step1) 55%, var(--surface)); overflow:hidden}
.dayrow .db i{display:block; height:100%; border-radius:100px; background:var(--step3)}
.dayrow .dn{font-size:12.5px; font-weight:600; text-align:right}
@media (max-width:620px){ .dayrow{grid-template-columns:minmax(84px,auto) 1fr 44px; gap:9px; padding:9px 12px} }
.chans{border:1px solid var(--line); border-radius:var(--r); background:var(--surface); overflow:hidden; margin-bottom:30px}
.chan{display:grid; grid-template-columns:62px minmax(70px,1fr) 46px minmax(160px,1.35fr); gap:14px; align-items:center; padding:12px 16px; border-top:1px solid var(--line)}
.chan:first-child{border-top:0}
.chan .cl{font-weight:600}
.chan .cp{font-family:var(--mono); font-size:12.5px; font-weight:600; font-variant-numeric:tabular-nums; text-align:right}
.chan .cf{font-size:12.5px; color:var(--muted)}

@media (max-width:880px){ .tiles{grid-template-columns:repeat(2,1fr)} }
@media (max-width:680px){
  .hero .n{font-size:44px}
  .attn{justify-content:flex-start}
  .reptable th.col-calls,.reptable td.col-calls,.reptable th.col-ans,.reptable td.col-ans{display:none}
  /* no room for a bar this narrow — the number carries it, and the table may scroll */
  .reps{overflow-x:auto}
  .reptable{min-width:340px}
  .track{display:none}
  .covpct{width:auto; text-align:left}
  .chan{grid-template-columns:56px 1fr 46px; row-gap:5px}
  .chan .cf{grid-column:1/-1}
}

.tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--surface); margin-bottom:28px}
table{border-collapse:collapse; width:100%; min-width:860px}
th,td{text-align:right; padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap}
th{font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:600; background:var(--surface-2); position:sticky; top:0}
th:first-child,td:first-child{text-align:left}
tbody tr:last-child td{border-bottom:0}
tbody tr.total td{font-weight:600; background:var(--surface-2)}
td.name{font-weight:600}
td .who{display:flex; align-items:center; gap:8px}
.meter{width:74px; height:6px; border-radius:100px; background:var(--line); overflow:hidden; display:inline-block; vertical-align:middle; margin-left:8px}
.meter i{display:block; height:100%; background:var(--accent); border-radius:100px}
.stale{color:var(--crit)}

.finder{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px}
.search{flex:1 1 260px; display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line-2); border-radius:var(--r); padding:0 11px}
.search input{flex:1; border:0; background:none; padding:9px 0; min-width:0}
.search input::placeholder{color:var(--muted)}
.search .ico{color:var(--muted); font-size:13px}
.results{display:flex; flex-direction:column; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.res{display:flex; align-items:center; gap:12px; padding:10px 13px; background:var(--surface); flex-wrap:wrap}
.res .rn{font-weight:600; flex:1 1 190px}
.res .onlist{font-size:12px; color:var(--muted); white-space:nowrap}
.res .rmeta{display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:12px; color:var(--muted)}
.empty{padding:26px 16px; text-align:center; color:var(--muted); background:var(--surface); border:1px dashed var(--line-2); border-radius:var(--r)}

/* ---------- rep board ---------- */
.boardbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px}
.chips{display:flex; gap:4px; flex-wrap:wrap}
.fchip{border:1px solid var(--line-2); background:var(--surface); border-radius:100px; padding:5px 11px; font-size:12.5px; font-weight:600; color:var(--ink-2); cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.fchip .c{opacity:.62; font-weight:500; font-variant-numeric:tabular-nums}
.reptable .nb{color:var(--muted); font-size:12px}
.batchbar{display:flex; gap:7px; align-items:center; flex-wrap:wrap; margin:0 0 14px}
.batchbar .bl{font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:600}
.batchbar .bh{color:var(--muted); font-size:12px; margin-left:2px}
@media (max-width:620px){ .batchbar .bh{flex-basis:100%; margin:2px 0 0} }
.sel{background:var(--surface); border:1px solid var(--line-2); border-radius:var(--r); padding:7px 9px; font-size:13px; font-weight:500}

.list{display:flex; flex-direction:column; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.listhead{display:grid; grid-template-columns:var(--cols); gap:10px; align-items:center; padding:7px 12px; background:var(--surface-2); font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:600}
.listhead span:nth-child(n+3){text-align:center}
.listhead span:nth-child(2){text-align:left}
.row{--cols:34px minmax(126px,1.5fr) 376px 56px 158px 184px 92px; display:grid; grid-template-columns:var(--cols); gap:10px; align-items:center; padding:8px 12px; background:var(--surface); scroll-margin-top:120px}
.listhead{--cols:34px minmax(126px,1.5fr) 376px 56px 158px 184px 92px}
.row:hover{background:var(--surface-2)}
.row.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:var(--accent-soft)}100%{background:var(--surface)}}
.c-rank{font-family:var(--mono); font-size:12px; color:var(--muted); text-align:right}
.c-lead{min-width:0}
.lead-name{font-weight:600; display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.lead-name .nm{overflow-wrap:anywhere}
.lead-meta{display:flex; align-items:center; gap:7px; flex-wrap:wrap; font-size:11.5px; color:var(--muted); margin-top:1px}
.lead-meta a{color:var(--muted)}
.lead-meta a:hover{color:var(--accent)}
.tagb{font-size:10px; font-weight:700; letter-spacing:.06em; padding:1px 5px; border-radius:4px; text-transform:uppercase}
.tagb.HOT{color:var(--hot); background:var(--hot-soft)}
.tagb.Distress{color:var(--distress); background:var(--distress-soft)}
.st{font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; padding:1px 6px; border-radius:100px; border:1px solid var(--line-2); color:var(--muted)}
.st.called{color:var(--accent); border-color:color-mix(in srgb, var(--accent) 35%, var(--line)); background:var(--accent-soft)}
.st.responded{color:var(--good); border-color:color-mix(in srgb, var(--good) 35%, var(--line)); background:var(--good-soft)}
.st.touched{color:var(--warn); border-color:color-mix(in srgb, var(--warn) 35%, var(--line))}

.log{display:flex; gap:5px; min-width:0}
.ctr{flex:1 1 auto; display:flex; align-items:stretch; min-width:0; border:1px solid var(--line-2); border-radius:var(--r); overflow:hidden; background:var(--surface)}
.ctr .hit{flex:1; display:flex; align-items:center; justify-content:space-between; gap:6px; padding:6px 4px 6px 8px; background:none; border:0; cursor:pointer; font-size:11.5px; font-weight:600; color:var(--ink-2); min-width:0}
.ctr .hit:hover{background:var(--accent-soft); color:var(--accent)}
.ctr .hit .lbl{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ctr .hit .n{font-family:var(--mono); font-size:14px; font-weight:600; color:var(--ink)}
.ctr .hit .n.zero{color:var(--muted); font-weight:400}
.ctr .un{border:0; border-left:1px solid var(--line); background:var(--surface-2); color:var(--muted); width:20px; cursor:pointer; font-size:13px; line-height:1}
.ctr .un:hover{background:var(--crit-soft); color:var(--crit)}
.ctr.on{border-color:color-mix(in srgb, var(--accent) 45%, var(--line))}
.c-calls{text-align:center}
.c-calls .n{font-family:var(--mono); font-size:19px; font-weight:600}
.c-calls .n.zero{color:var(--muted); font-weight:400}
.c-calls .lab{display:block; font-size:9.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted)}
.flags{display:flex; gap:4px; justify-content:center}
.tgl{border:1px solid var(--line-2); background:var(--surface); border-radius:var(--r); padding:6px 9px; font-size:11.5px; font-weight:600; color:var(--muted); cursor:pointer}
.tgl:hover{border-color:var(--accent); color:var(--accent)}
.tgl[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.tgl.ind{cursor:default; border-style:dashed}

<script>
(function(){
"use strict";

var REP_ORDER = ["Era","Barbie","David","Diego"];
var RESP = [["no","No"],["call","Yes – call back"],["text","Yes – text"],["email","Yes – email"],
            ["both","Yes – text & email"]];
var RESP_LABEL = {no:"No", call:"Yes – call back", text:"Yes – text", email:"Yes – email",
                  both:"Yes – text & email"};
var COUNTERS = [["answered","Answered"],["vmLeft","VM left"],["noVm","No VM"],["vmFull","VM full"]];
/* why a dial went nowhere, split by what it means for the lead:
   "number" — the lead is still live, the phone is not, so it wants skip tracing
   "closed" — stop contacting this lead                                        */
var LEAD_STATUS = [
  ["",            "Working",              ""      ],
  ["wrongNumber", "Wrong number",         "number"],
  ["invalid",     "Invalid / disconnected","number"],
  ["optedOut",    "Opted out",            "closed"],
  ["doNotCall",   "Do not call",          "closed"],
  ["notOwner",    "Not the owner",        "closed"],
  ["outOfBuyBox", "Out of buy box area",  "dq"    ],
  ["skipped",     "Skipped for now",      "skip"  ]
];
var PARKED_FILTERS = {number:1, closed:1, dq:1, skip:1};
function chipClassFor(bucket){
  return bucket === "dq" ? " dq" : bucket === "skip" ? " skip" : bucket ? " dead" : "";
}
var STATUS_LABEL = {}, STATUS_BUCKET = {};
LEAD_STATUS.forEach(function(x){ STATUS_LABEL[x[0]] = x[1]; STATUS_BUCKET[x[0]] = x[2]; });
var STALE_MS = 36*60*60*1000, QUIET_MS = 12*60*60*1000;
/* Reps work from wherever they are; the company day is California's, so every
   rep's work lands in the same business day however far ahead their clock is. */
var BIZ_TZ = "America/Los_Angeles";
var DAY_KEYS = ["calls","answered","vmLeft","noVm","vmFull","texts","emails","responses"];
function bizDay(when){
  var d = when ? new Date(when) : new Date();
  try {
    return new Intl.DateTimeFormat("en-CA", {timeZone:BIZ_TZ, year:"numeric", month:"2-digit", day:"2-digit"}).format(d);
  } catch(e){ return d.toISOString().slice(0,10); }
}
/* the four states a lead can be in, most worked first — one hue, light to dark */
var STEPS = [["responded","Responded","var(--step4)"],["called","Called","var(--step3)"],
             ["touched","Texted or emailed","var(--step2)"],["toCall","Not called yet","var(--step1)"],
             ["skip","Skipped for now","var(--info, #7f8c99)"],
             ["dq","Out of buy box","var(--warn)"],
             ["dead","Parked — bad number or closed","var(--line-2)"]];

var db = null, downloads = null;
var raw = new Map();          // id -> server doc
var pending = new Map();      // id -> unconfirmed patch
var leads = [];               // merged, sorted
var rowRefs = new Map();
var flushTimer = null, failures = 0, sawData = false, dbReady = false, localOnly = false;
var view = "dash";
var me = lsGet("thb.me") || "";
var filter = { q:"", chip:"all", sort:"rank" };
var gq = "";
var dayPick = "";   // which day the day-by-day table is showing
var showCols = false;
var batchPick = lsGet("thb.batch") || "";   // "" = every batch at once
var listDirty = false, openNotes = new Set();
var history = [];   // this session, this person, newest last
var bulkText = "", addPreview = null;
var skipPending = new Set();   // rows waiting for a reason before the skip applies
/* { <list owner>: <person working it> } — a list keeps its owner's name; this
   only says who is doing the work while they are away. Set by ops. */
var coverage = {};
function coveredBy(rep){ return coverage[rep] || ""; }
function coveringFor(){
  var out = [];
  for(var owner in coverage){ if(coverage[owner] === me) out.push(owner); }
  return out;
}
/* words the board itself prints — a pasted row is made of these, never of names */
var UI_WORDS = ["hot","distress","rei","rei ↗","called","to call","responded","touched","working",
                "calls","call","text","email","answered","vm left","no vm","vm full","you",
                "wrong number","invalid / disconnected","opted out","do not call","not the owner",
                "out of buy box area","yes – text","yes – email","yes – call back","yes – text & email","no"];

/* ---------------- storage helpers ---------------- */
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
function localLoad(){
  try {
    var t = localStorage.getItem("thb.leads.v1");
    if(!t) return;
    JSON.parse(t).forEach(function(l){ raw.set(l.id, l); });
  } catch(e){}
}
function localSave(){
  try { localStorage.setItem("thb.leads.v1", JSON.stringify([...raw.values()])); } catch(e){}
}

/* ---------------- model ---------------- */
function blank(l){
  return {
    id:l.id, owner:l.owner||"", ownerId:l.ownerId||"", rank:+l.rank||0,
    name:l.name||"", phone:l.phone||"", bucket:l.bucket||"", reiLink:l.reiLink||"",
    task:l.task||"", assignedDate:l.assignedDate||"",
    calls:+l.calls||0, answered:+l.answered||0, vmLeft:+l.vmLeft||0, noVm:+l.noVm||0, vmFull:+l.vmFull||0,
    leadStatus:l.leadStatus||"", skipReason:l.skipReason||"",
    byDay:(l.byDay && typeof l.byDay === "object") ? l.byDay : {},
    textSent:!!l.textSent, emailSent:!!l.emailSent, responded:l.responded||"no",
    notes:l.notes||"", updatedAt:l.updatedAt||"", updatedBy:l.updatedBy||""
  };
}
function rebuild(){
  var out = [];
  raw.forEach(function(doc, id){
    var p = pending.get(id);
    out.push(blank(p ? Object.assign({}, doc, p, {id:id}) : Object.assign({id:id}, doc)));
  });
  leads = out;
  render();
}
function byId(id){ for(var i=0;i<leads.length;i++){ if(leads[i].id===id) return leads[i]; } return null; }
function repsPresent(){
  var s = new Set(leads.map(function(l){ return l.owner; }).filter(Boolean));
  var out = REP_ORDER.filter(function(r){ return s.has(r); });
  [...s].sort().forEach(function(r){ if(out.indexOf(r)<0) out.push(r); });
  return out.length ? out : REP_ORDER.slice();
}
function canOpen(rep){
  if(me === "admin") return true;        // Cherry / ops reads every board
  if(!me) return false;                  // nobody picked yet: dashboard only
  return rep === me || coveredBy(rep) === me;   // your own list, plus any you cover
}
/* Lists come in batches, one assignment date each. An older batch is finished
   work, so folding it in with a fresh one turns a hand-out into what looks like
   a collapse. Every counted figure respects the pick; searching never does. */
function batchList(){
  var seen = {};
  leads.forEach(function(l){ if(l.assignedDate) seen[l.assignedDate] = (seen[l.assignedDate]||0)+1; });
  return Object.keys(seen).sort().map(function(d,i){ return {date:d, label:"Batch "+(i+1), n:seen[d]}; });
}
function inBatch(l){ return !batchPick || l.assignedDate === batchPick; }
function batchLabel(d){
  var hit = batchList().filter(function(b){ return b.date === d; })[0];
  return hit ? hit.label : "";
}
function batchBar(){
  var bs = batchList();
  if(bs.length < 2) return "";      // with one batch, "all batches" is the only view
  return '<div class="batchbar"><span class="bl">Showing</span>'+
    [{date:"", label:"All batches", n:leads.length}].concat(bs).map(function(b){
      return '<button class="fchip" type="button" data-batch="'+esc(b.date)+'" aria-pressed="'+
        (batchPick === b.date)+'">'+esc(b.label)+' <span class="c">'+fmtN(b.n)+'</span></button>';
    }).join("")+
    '<span class="bh">'+(batchPick
      ? esc(batchLabel(batchPick)+" was handed out "+dayLabel(batchPick))
      : esc(bs.map(function(b){
          var list = leads.filter(function(l){ return l.assignedDate === b.date; });
          var st = stats(list), sp = splitByStatus(list);
          return b.label+" "+pct(st.live - sp.toCall, st.assigned)+" worked";
        }).join(" \u00b7 ")))+'</span></div>';
}
function bucketOf(l){ return STATUS_BUCKET[l.leadStatus] || ""; }
function isLive(l){ return !bucketOf(l); }
function hasWork(l){
  return l.calls > 0 || l.textSent || l.emailSent || !!l.leadStatus ||
         (l.responded && l.responded !== "no") || !!(l.notes||"").trim();
}
function workedAt(l){ return hasWork(l) ? (l.updatedAt||"") : ""; }
function statusOf(l){
  if(l.leadStatus){
    var b = bucketOf(l);
    return [b === "skip" ? "Skipped" : (STATUS_LABEL[l.leadStatus] || l.leadStatus),
            b === "dq" ? "dq" : (b === "skip" ? "skip" : "dead")];
  }
  if(l.responded && l.responded!=="no") return ["Responded","responded"];
  if(l.calls>0) return ["Called","called"];
  if(l.textSent||l.emailSent) return ["Touched","touched"];
  return ["To call",""];
}
function stats(list){
  var s = {assigned:list.length, contacted:0, calls:0, answered:0, vmLeft:0, noVm:0, vmFull:0, texts:0, emails:0, responded:0,
           phoned:0, picked:0, textBack:0, emailBack:0, needsNumber:0, closed:0, disq:0, skipped:0, last:""};
  list.forEach(function(l){
    var bucket = bucketOf(l), live = bucket !== "number" && bucket !== "closed";
    if(bucket === "number") s.needsNumber++;
    else if(bucket === "closed") s.closed++;
    else if(bucket === "dq") s.disq++;
    else if(bucket === "skip") s.skipped++;
    if(live && l.calls>0) s.contacted++;
    if(live && (l.calls>0 || l.responded === "call")) s.phoned++;
    if(live && (l.answered>0 || l.responded === "call")) s.picked++;
    if(live && (l.responded === "text"  || l.responded === "both")) s.textBack++;
    if(live && (l.responded === "email" || l.responded === "both")) s.emailBack++;
    s.calls+=l.calls; s.answered+=l.answered; s.vmLeft+=l.vmLeft; s.noVm+=l.noVm; s.vmFull+=l.vmFull||0;
    if(live && l.textSent) s.texts++;
    if(live && l.emailSent) s.emails++;
    if(live && l.responded && l.responded!=="no") s.responded++;
    var w = workedAt(l);
    if(w && w > s.last) s.last = w;
  });
  s.unworkable = s.needsNumber + s.closed;
  s.live = s.assigned - s.unworkable;   // still counts toward the rates
  s.toWork = s.live - s.disq - s.skipped;   // what is left on the call list
  s.rate = s.contacted ? s.responded/s.contacted : 0;
  // one rate per channel, each against the leads that channel was actually used on
  s.callRate  = s.phoned ? s.picked/s.phoned : 0;
  s.textRate  = s.texts  ? s.textBack/s.texts   : 0;
  s.emailRate = s.emails ? s.emailBack/s.emails : 0;
  return s;
}

/* ---------------- writes ---------------- */
function canEdit(l){ return !!me && (l.owner === me || coveredBy(l.owner) === me); }
function edit(id, patch, quiet, label){
  if(label){
    var was = byId(id);
    if(was){
      var before = {};
      Object.keys(patch).forEach(function(k){ before[k] = was[k]; });
      history.push({id:id, before:before, after:Object.assign({}, patch),
                    label:label, name:was.name || "(no name)"});
      if(history.length > 30) history.shift();
    }
  }
  var prev = pending.get(id) || {};
  var next = Object.assign({}, prev, patch, {updatedAt:new Date().toISOString(), updatedBy:me||"—"});
  pending.set(id, next);
  var cur = raw.get(id);
  if(cur) raw.set(id, Object.assign({}, cur, next));
  if(!quiet) rebuild();
  setSync();
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, 500);
}
function flush(){
  if(!pending.size) return;
  if(!db){ localSave(); pending.clear(); failures=0; setSync(); return; }
  var jobs = [...pending.entries()];
  jobs.forEach(function(pair){
    var id = pair[0], patch = pair[1];
    db.doc("leads/"+id).update(patch).then(function(){
      if(pending.get(id) === patch) pending.delete(id);
      failures = 0; setSync();
    }).catch(function(err){
      if(err && err.code === "invalid_argument"){
        var body = Object.assign({}, raw.get(id) || {}, patch);
        delete body.id;
        return db.doc("leads/"+id).set(body).then(function(){
          if(pending.get(id) === patch) pending.delete(id);
          failures = 0; setSync();
        });
      }
      throw err;
    }).catch(function(err){
      failures++;
      setSync();
      if(failures === 1) toast("Couldn’t save — retrying", true);
      clearTimeout(flushTimer);
      flushTimer = setTimeout(flush, Math.min(15000, 1500*failures));
    });
  });
}
function dayPatch(l, deltas){
  var d = bizDay(), cur = (l.byDay && l.byDay[d]) || {}, row = {by: me || "—"};
  DAY_KEYS.forEach(function(k){
    var v = (cur[k] || 0) + (deltas[k] || 0);
    if(v > 0) row[k] = v;
  });
  var byDay = {}; byDay[d] = row;
  return byDay;   // update() merges nested objects, so other days are untouched
}
function labelFor(kind){
  for(var i=0;i<COUNTERS.length;i++){ if(COUNTERS[i][0]===kind) return COUNTERS[i][1]; }
  return kind;
}
function logCall(id, kind){
  var l = byId(id); if(!l || !canEdit(l)) return;
  var p = {}; p[kind] = (l[kind]||0)+1; p.calls = (l.calls||0)+1;
  var d = {calls:1}; d[kind] = 1;
  p.byDay = dayPatch(l, d);
  edit(id, p, false, labelFor(kind) + " +1");
}
function undoCall(id, kind){
  var l = byId(id); if(!l || !canEdit(l) || !l[kind]) return;
  var p = {}; p[kind] = l[kind]-1; p.calls = Math.max(0,(l.calls||0)-1);
  var d = {calls:-1}; d[kind] = -1;
  p.byDay = dayPatch(l, d);
  edit(id, p, false, labelFor(kind) + " −1");
}

/* ---------------- rendering: chrome ---------------- */
function setSync(){
  var el = document.getElementById("sync"), t = document.getElementById("syncTxt");
  el.className = "chip";

/* Every lead carries what happened to it on each day; this turns that into
   "who worked, on whose list, on this day". */
function dailyRollup(){
  var days = {};
  leads.forEach(function(l){
    var bd = l.byDay || {};
    for(var d in bd){
      if(!Object.prototype.hasOwnProperty.call(bd, d)) continue;
      var row = bd[d] || {}, who = row.by || "—";
      var day = days[d] || (days[d] = {total:{}, who:{}});
      var k = who + "\u0000" + l.owner;
      var cell = day.who[k] || (day.who[k] = {who:who, list:l.owner, leads:0});
      cell.leads++;
      DAY_KEYS.forEach(function(f){
        if(!row[f]) return;
        cell[f] = (cell[f]||0) + row[f];
        day.total[f] = (day.total[f]||0) + row[f];
      });
    }
  });
  return days;
}
/* Days worked belongs to the person who did the work, not to whose list it
   was — so covering David's list is a day worked for Barbie, not for David.
   Days before tracking began can only be counted from each lead's last touch,
   which is a floor, never the true figure. */
function daysWorked(){
  var daily = dailyRollup(), tracked = Object.keys(daily).sort();
  var who = {};
  function slot(p){
    return who[p] || (who[p] = {person:p, days:{}, calls:0, lists:{}, before:{}});
  }
  repsPresent().forEach(slot);
  tracked.forEach(function(d){
    var day = daily[d];
    for(var k in day.who){
      var c = day.who[k], w = slot(c.who);
      w.days[d] = true;
      w.calls += c.calls || 0;
      w.lists[c.list] = true;
    }
  });
  /* Any day with no byDay row of its own: one date per lead, so this can only
     be a floor. Work done today before daily tracking started belongs here too,
     so the test is "is that day already counted exactly?" and never "is that day
     older than the first tracked one?" — which silently dropped today. */
  leads.forEach(function(l){
    if(!hasWork(l) || !l.updatedAt || !l.updatedBy || l.updatedBy === "—") return;
    var d = bizDay(l.updatedAt), w = slot(l.updatedBy);
    if(w.days[d]) return;
    w.before[d] = true;
  });
  return {tracked: tracked,
          rows: Object.keys(who).map(function(p){ return who[p]; })
                  .sort(function(a,b){ return Object.keys(b.days).length - Object.keys(a.days).length
                                            || a.person.localeCompare(b.person); })};
}
function dayShort(d){
  // built by hand: some locales put the number first, and the weekday reads better leading
  var t = new Date(d + "T12:00:00Z");
  if(isNaN(t)) return d;
  return t.toLocaleDateString("en-US", {weekday:"short", timeZone:"UTC"}) + " " + t.getUTCDate();
}
function dayLabel(d){
  var t = new Date(d + "T12:00:00Z");
  return isNaN(t) ? d : t.toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric", timeZone:"UTC"});
}
function splitByStatus(list){
  var c = {responded:0, called:0, touched:0, toCall:0, dead:0, dq:0, skip:0};
  list.forEach(function(l){
    var k = statusOf(l)[1];
    if(k === "skip") c.skip++;
    else if(k === "dq") c.dq++;
    else if(k === "dead") c.dead++;
    else if(k === "responded") c.responded++;
    else if(k === "called") c.called++;
    else if(k === "touched") c.touched++;
    else c.toCall++;
  });
  return c;
}
function agoClass(last){
  if(!last) return "bad";
  var d = Date.now() - new Date(last).getTime();
  return d > STALE_MS ? "bad" : (d > QUIET_MS ? "warn" : "ok");
}

function matches(l,q){

         (l.phone||"").toLowerCase().indexOf(q)>=0 ||

function visibleLeads(){
  var q = filter.q.trim().toLowerCase();
  var list = leads.filter(function(l){ return l.owner === view; });
  list = list.filter(function(l){
    if(!inBatch(l)) return false;
    if(q && !matches(l,q)) return false;
    // a parked lead only shows under its own filter, never in the working list
    if(!PARKED_FILTERS[filter.chip] && !isLive(l)) return false;
    switch(filter.chip){
      case "todo": return l.calls === 0;
      case "called": return l.calls > 0;
      case "answered": return l.answered > 0;
      case "responded": return l.responded && l.responded !== "no";
      case "HOT": return l.bucket === "HOT";
      case "Distress": return l.bucket === "Distress";
      case "number": return bucketOf(l) === "number";
      case "closed": return bucketOf(l) === "closed";
      case "dq": return bucketOf(l) === "dq";
      case "skip": return bucketOf(l) === "skip";
      default: return true;
    }
  });
  var s = filter.sort;
  list.sort(function(a,b){
    if(s==="name") return (a.name||"").localeCompare(b.name||"");
    if(s==="calls") return b.calls - a.calls || a.rank - b.rank;
    if(s==="recent") return (b.updatedAt||"").localeCompare(a.updatedAt||"") || a.rank - b.rank;
    return a.rank - b.rank;
  });
  return list;
}

function renderList(list, editable){
  var host = document.getElementById("list");

  if(host.contains(document.activeElement) && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){
    listDirty = true; return;
  }
  listDirty = false;
  if(!list.length){
    rowRefs.clear();
    host.innerHTML = '<div class="empty">No lead here matches that filter.</div>';
    return;
  }
  var sig = list.map(function(l){ return l.id; }).join(",") + "|" + editable;
  if(host.dataset.sig === sig){
    list.forEach(function(l){ syncRow(l); });
    return;
  }
  host.dataset.sig = sig;
  rowRefs.clear();
  var frag = document.createDocumentFragment();
  list.forEach(function(l){ frag.appendChild(buildRow(l, editable)); });
  host.innerHTML = "";
  host.appendChild(frag);
  list.forEach(function(l){ var r = rowRefs.get(l.id); if(r && !r.note.hidden) fitNote(r.notes); });

function syncRow(l){
  var r = rowRefs.get(l.id);
  if(!r) return;
  r.nm.textContent = l.name || "(no name)";
  r.tel.textContent = fmtPhone(l.phone);
  r.tel.href = l.phone ? "tel:"+l.phone : "#";
  var st = statusOf(l);
  r.st.textContent = st[0];
  r.st.className = "st " + st[1];
  COUNTERS.forEach(function(c){
    var v = l[c[0]]||0;
    r[c[0]].textContent = v;
    r[c[0]].className = "n num" + (v?"":" zero");
    r[c[0]+"_box"].className = "ctr" + (v?" on":"");
  });
  r.calls.textContent = l.calls||0;
  r.calls.className = "n num" + (l.calls?"":" zero");
  r.callf.className = "tgl ind" + (l.calls ? " on" : "");
  r.callf.title = l.calls
    ? l.calls + (l.calls === 1 ? " call logged" : " calls logged") + " — set by the buttons on the left"
    : "No call logged yet — use Answered / VM left / No VM";
  r.tglText.setAttribute("aria-pressed", String(!!l.textSent));
  r.tglEmail.setAttribute("aria-pressed", String(!!l.emailSent));
  if(r.sel !== document.activeElement) r.sel.value = l.responded || "no";
  r.sel.className = (l.responded && l.responded!=="no") ? "yes" : "";
  r.upd.textContent = workedAt(l) ? ago(workedAt(l)) : "—";
  r.upd.title = workedAt(l) ? (new Date(l.updatedAt).toLocaleString() + (l.updatedBy?" · "+l.updatedBy:"")) : "";
  r.el.classList.toggle("dead", !isLive(l));
  r.back.hidden = isLive(l);
  var skipping = skipPending.has(l.id), isSkip = bucketOf(l) === "skip";
  r.skipwrap.hidden = !(skipping || isSkip);
  if(!r.skipwrap.hidden && r.skipin !== document.activeElement) r.skipin.value = l.skipReason || "";
  r.skipwhy.hidden = !isSkip;
  r.skipwhy.textContent = isSkip
    ? "· " + (l.skipReason || "no reason given") + (l.updatedAt ? " · skipped " + ago(l.updatedAt) : "")
    : "";
  for(var i=0;i<r.schips.length;i++){
    r.schips[i].setAttribute("aria-pressed", String(r.schips[i].dataset.s === (l.leadStatus||"")));
  }
  r.notebtn.className = "notebtn" + (l.notes || l.leadStatus ? " has" : "");
  if(r.notes !== document.activeElement) r.notes.value = l.notes || "";
  var open = openNotes.has(l.id), first = (l.notes||"").split("\n")[0];
  r.notebtn.setAttribute("aria-expanded", String(open));
  r.notebtn.title = l.notes ? (open ? "Hide note" : "Show note — " + first.slice(0,70)) : "Add a note";
  r.note.hidden = !open;
  if(open && r.notes !== document.activeElement) fitNote(r.notes);
}

function exportScope(){
  // an export hands over exactly what is on screen, batch pick included
  var pool = leads.filter(inBatch), tag = batchPick ? "-batch"+batchLabel(batchPick).split(" ")[1] : "";
  if(view !== "dash"){
    var narrowed = filter.chip !== "all" || filter.q.trim();
    if(narrowed) return {list: visibleLeads(), who: view.toLowerCase()+"-"+filter.chip+tag,
                         label: "Export these " + visibleLeads().length + " (CSV)"};
    return {list: pool.filter(function(l){ return l.owner===view; }),
            who: view.toLowerCase()+tag, label: "Export " + view + " (CSV)"};
  }
  if(me === "admin")   return {list: pool, who: "all-reps"+tag, label: "Export all (CSV)"};
  if(me)               return {list: pool.filter(function(l){ return l.owner===me; }),
                               who: me.toLowerCase()+tag, label: "Export " + me + " (CSV)"};
  return {list: [], who: "", label: "Export CSV"};
}

function undoLast(){
  if(!history.length){ toast("Nothing to undo", true); return; }
  var h = history.pop(), l = byId(h.id);
  syncUndoBtn();
  if(!l){ toast("That lead is no longer here", true); return; }
  if(!canEdit(l)){ toast("That lead isn't yours to change", true); return; }
  // someone else may have moved on since; their work outranks this undo
  var moved = Object.keys(h.after).some(function(k){ return String(l[k]) !== String(h.after[k]); });
  if(moved){
    toast((l.updatedBy && l.updatedBy !== me ? l.updatedBy : "Someone") +
          " changed this lead after you — not undoing " + h.label, true);
    return;
  }
  edit(h.id, h.before);   // no label, so an undo is never itself undone
  toast("Undid " + h.label + " on " + h.name);
}
function syncUndoBtn(){
  var b = document.getElementById("undoBtn");
  if(!b) return;
  var last = history[history.length-1];
  b.disabled = !last;
  b.title = last ? "Undo " + last.label + " on " + last.name : "Nothing to undo";
}

function syncExportBtn(){

/* ---------------- helpers ---------------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function pct(a,b){ return b ? Math.round(100*a/b)+"%" : "0%"; }
function fmtN(n){ return Number(n||0).toLocaleString("en-US"); }
function fmtPhone(p){
  var d = String(p||"").replace(/[^0-9]/g,"");
  if(d.length===11 && d[0]==="1") d = d.slice(1);
  if(d.length===10) return "("+d.slice(0,3)+") "+d.slice(3,6)+"-"+d.slice(6);
  return p||"";
}
function ago(iso){
  var t = new Date(iso).getTime();
  if(isNaN(t)) return "—";
  var s = Math.max(0, (Date.now()-t)/1000);
  if(s<60) return "just now";
  if(s<3600) return Math.floor(s/60)+"m ago";
  if(s<86400) return Math.floor(s/3600)+"h ago";
  if(s<604800) return Math.floor(s/86400)+"d ago";
  return new Date(iso).toLocaleDateString();
}
var NOTE_MIN = 70, NOTE_MAX = 240;   // ~3 lines floor, ~12 lines before it scrolls
function fitNote(el){
  // scrollHeight only means anything once the box is laid out
  if(!el || !el.isConnected || el.offsetParent === null) return;
  el.style.height = "auto";
  el.style.height = Math.max(NOTE_MIN, Math.min(el.scrollHeight + 2, NOTE_MAX)) + "px";
}
function toast(msg, bad){
  var wrap = document.getElementById("toast");
  var el = document.createElement("div");
  el.className = "toast" + (bad?" bad":"");
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3200);
}

/* ---------------- CSV ---------------- */
function csvCell(v){
  var s = String(v==null?"":v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function leadsCsv(list){
  var head = ["Owner","Owner_ID","Rank","Name","Phone","Bucket","Contact_ID","REI_Link","Status",
    "Outbound_Calls","Answered","VM_Left","No_Answer_No_VM","VM_Full","Text_Sent","Email_Sent","Responded","Lead_Status","Skip_Reason","Notes","Assigned_Date","Last_Updated","Updated_By","Worked_By"];
  var rows = list.map(function(l){
    return [l.owner,l.ownerId,l.rank,l.name,l.phone,l.bucket,l.id,l.reiLink,statusOf(l)[0],
      l.calls,l.answered,l.vmLeft,l.noVm,l.vmFull,l.textSent?"Yes":"No",l.emailSent?"Yes":"No",
      RESP_LABEL[l.responded]||"No",STATUS_LABEL[l.leadStatus]||"Working",l.skipReason,l.notes,l.assignedDate,l.updatedAt,l.updatedBy,coveredBy(l.owner)||l.owner].map(csvCell).join(",");
  });
  return head.join(",")+"\n"+rows.join("\n")+"\n";
}
function rollupCsv(){
  var head = ["Rep","Assigned","To_Work","Needs_New_Number","Closed","Out_Of_Buy_Box","Skipped","Contacted","Outbound_Calls","Answered","VM_Left","No_Answer_No_VM","Texts_Sent","Emails_Sent","Responded","Response_Rate",
    "Leads_Phoned","Answered_Or_Called_Back","Call_Response_Rate","Replied_By_Text","Text_Response_Rate","Replied_By_Email","Email_Response_Rate","Last_Activity"];
  var pool = leads.filter(inBatch);
  var rows = repsPresent().concat(["All reps"]).map(function(r){
    var s = stats(r==="All reps" ? pool : pool.filter(function(l){ return l.owner===r; }));
    return [r,s.assigned,s.toWork,s.needsNumber,s.closed,s.disq,s.skipped,s.contacted,s.calls,s.answered,s.vmLeft,s.noVm,s.texts,s.emails,s.responded,
      (s.rate*100).toFixed(1)+"%",
      s.phoned, s.picked, rateCell(s.picked, s.phoned),
      s.textBack, rateCell(s.textBack, s.texts),
      s.emailBack, rateCell(s.emailBack, s.emails),
      s.last||"never"].map(csvCell).join(",");
  });
  return head.join(",")+"\n"+rows.join("\n")+"\n";
}
function today(){ return new Date().toISOString().slice(0,10); }
function offerFile(filename, text, title){
  if(!downloads){
    document.getElementById("copyTitle").textContent = title || "Export";
    document.getElementById("copyText").value = text;
    document.getElementById("copyDlg").showModal();
    return;
  }
  downloads.save({filename:filename, data:text}).then(function(){
    toast("Saved " + filename);
  }).catch(function(err){
    var code = err && err.code;
    if(code === "declined") return;
    if(code === "rate_limited"){ toast("A save is already open — finish that one first", true); return; }
    document.getElementById("copyTitle").textContent = title || "Export";
    document.getElementById("copyText").value = text;
    document.getElementById("copyDlg").showModal();
  });
}

/* ---------------- events ---------------- */
document.getElementById("tabs").addEventListener("click", function(e){
  var b = e.target.closest("[data-v]"); if(!b) return;
  view = b.dataset.v;
  filter.q = ""; 
  document.getElementById("repView").dataset.rep = "";
  render();
  window.scrollTo({top:0, behavior:"instant"});
});
document.getElementById("me").addEventListener("change", function(e){
  me = e.target.value === "__admin" ? "admin" : e.target.value;
  lsSet("thb.me", me);
  history = [];
  document.getElementById("repView").dataset.rep = "";
  if(me && me !== "admin") view = me;
  else if(!canOpen(view)) view = "dash";
  render();
  if(me && me !== "admin") toast("Logging as " + me + " — you can edit " + me + "’s list");
});
document.getElementById("exportBtn").addEventListener("click", function(){
  var scope = exportScope();
  if(!scope.list.length){ toast("Pick your name up top to export your list", true); return; }
  offerFile("thb-leads-"+scope.who+"-"+today()+".csv", leadsCsv(scope.list), "Lead export");
});
document.getElementById("copyBtn").addEventListener("click", function(){
  var ta = document.getElementById("copyText");
  ta.select();
  if(navigator.clipboard) navigator.clipboard.writeText(ta.value).then(function(){ toast("Copied"); }, function(){});
  else { try { document.execCommand("copy"); toast("Copied"); } catch(e){} }
});

document.getElementById("dashView").addEventListener("input", function(e){
  if(e.target.id === "gq"){ gq = e.target.value; renderResults(); }
});
function pickBatch(el){
  batchPick = el.dataset.batch || "";
  lsSet("thb.batch", batchPick);
  document.getElementById("repView").dataset.rep = "";   // the cached skeleton holds stale counts
  render();
}
document.getElementById("dashView").addEventListener("click", function(e){
  var bt = e.target.closest("[data-batch]");
  if(bt){ pickBatch(bt); return; }
  if(e.target.id === "rollupBtn"){
    offerFile("thb-rollup-"+today()+".csv", rollupCsv(), "Rollup export"); return;
  }
  if(e.target.id === "colsBtn"){ showCols = !showCols; renderDash(); return; }
  if(e.target.id === "dayPrev" || e.target.id === "dayNext"){
    var ds = Object.keys(dailyRollup()).sort(), i = ds.indexOf(dayPick);
    dayPick = ds[Math.max(0, Math.min(ds.length-1, i + (e.target.id === "dayNext" ? 1 : -1)))] || dayPick;
    renderDash(); return;
  }
  var dr = e.target.closest("[data-day]");
  if(dr){ dayPick = dr.dataset.day; renderDash(); return; }
  var g = e.target.closest("[data-goto]");
  if(g){
    view = g.dataset.rep;
    filter.q = ""; filter.chip = "all";
    document.getElementById("repView").dataset.rep = "";
    render();
    var el = document.querySelector('.row[data-id="'+g.dataset.goto+'"]');
    if(el){ el.scrollIntoView({block:"center", behavior:"smooth"}); el.classList.add("flash"); setTimeout(function(){ el.classList.remove("flash"); },1700); }
  }
});

var repView = document.getElementById("repView");
repView.addEventListener("click", function(e){
  var bt = e.target.closest("[data-batch]");
  if(bt){ pickBatch(bt); return; }
  var chip = e.target.closest("[data-chip]");
  if(chip){ filter.chip = chip.dataset.chip; renderRep(); return; }
  if(e.target.id === "notesBtn"){
    var vis = visibleLeads();
    var shut = vis.some(function(l){ return openNotes.has(l.id); });
    vis.forEach(function(l){
      if(shut) openNotes.delete(l.id);
      else if((l.notes||"").trim()) openNotes.add(l.id);
    });
    renderRep();
    return;
  }
  if(e.target.id === "undoBtn"){ undoLast(); return; }
  if(e.target.id === "bulkCheck"){ bulkCheck(); return; }
  if(e.target.id === "bulkCancel"){ addPreview = null; renderRep(); return; }
  if(e.target.id === "bulkBtn"){ bulkAdd(); return; }
  var act = e.target.closest("[data-act]");
  if(!act) return;
  var row = act.closest(".row"); if(!row) return;
  var id = row.dataset.id, l = byId(id);
  if(!l) return;
  var a = act.dataset.act;
  if(a === "note"){
    if(openNotes.has(id)) openNotes.delete(id); else openNotes.add(id);
    syncRow(l);
    var r = rowRefs.get(id);
    if(!r.note.hidden) r.notes.focus();
    return;
  }
  if(!canEdit(l)){
    toast(me ? "That’s " + l.owner + "’s lead — read-only for you" : "Pick your name up top first", true);
    return;
  }
  if(a === "revive"){
    skipPending.delete(id);
    edit(id, {leadStatus: "", skipReason: ""}, false, "Put back on the call list");
    toast((l.name || "Lead") + " is back on the call list");
    return;
  }
  if(a === "skipgo" || a === "skipcancel" || a === "skipwhy"){
    var rr = rowRefs.get(id);
    if(a === "skipcancel"){ skipPending.delete(id); syncRow(l); return; }
    var why = (rr.skipin.value || "").trim();
    if(!why){ toast("Say why you’re skipping it — one line is enough", true); rr.skipin.focus(); return; }
    skipPending.delete(id);
    edit(id, {leadStatus: "skipped", skipReason: why}, false, "Skipped — " + why);
    toast((l.name || "Lead") + " skipped for now");
    return;
  }
  if(a === "status"){
    // a skip is not recorded until there is a reason for it
    if(act.dataset.s === "skipped" && bucketOf(l) !== "skip"){
      skipPending.add(id);
      syncRow(l);
      rowRefs.get(id).skipin.focus();
      return;
    }
    skipPending.delete(id);
    edit(id, {leadStatus: act.dataset.s, skipReason: ""}, false,
         act.dataset.s ? STATUS_LABEL[act.dataset.s] : "Back to working");
    toast(act.dataset.s ? STATUS_LABEL[act.dataset.s] + " — off the call list" : "Back on the call list");
    return;
  }
  if(a === "log") logCall(id, act.dataset.k);
  else if(a === "undo") undoCall(id, act.dataset.k);
  else if(a === "toggle"){
    var p = {}, on = !l[act.dataset.k], what = act.dataset.k === "textSent" ? "Text" : "Email";
    p[act.dataset.k] = on;
    var dd = {};
    dd[act.dataset.k === "textSent" ? "texts" : "emails"] = on ? 1 : -1;
    p.byDay = dayPatch(l, dd);
    edit(id, p, false, what + (on ? " sent" : " cleared"));
  }
});
repView.addEventListener("keydown", function(e){
  if(e.key !== "Enter") return;
  var act = e.target.closest('[data-act="skipwhy"]'); if(!act) return;
  e.preventDefault();
  var row = act.closest(".row");
  if(row) row.querySelector('[data-act="skipgo"]').click();
});
repView.addEventListener("change", function(e){
  if(e.target.id === "sortSel"){ filter.sort = e.target.value; renderRep(); return; }
  var act = e.target.closest("[data-act]"); if(!act) return;
  var row = act.closest(".row"); if(!row) return;
  var l = byId(row.dataset.id); if(!l) return;
  if(!canEdit(l)){ syncRow(l); toast("That’s " + l.owner + "’s lead — read-only for you", true); return; }
  if(act.dataset.act === "resp"){
    var was = l.responded && l.responded !== "no", now = act.value && act.value !== "no";
    var rp = {responded: act.value};
    if(was !== now) rp.byDay = dayPatch(l, {responses: now ? 1 : -1});
    edit(row.dataset.id, rp, false, "Responded: " + (RESP_LABEL[act.value]||act.value));
  }
});
repView.addEventListener("input", function(e){
  if(e.target.id === "bulk"){ bulkText = e.target.value; return; }
  if(e.target.id === "rq"){ filter.q = e.target.value; renderRep(); return; }
  var act = e.target.closest('[data-act="notes"]'); if(!act) return;
  var row = act.closest(".row"); if(!row) return;
  var l = byId(row.dataset.id); if(!l || !canEdit(l)) return;
  fitNote(act);
  edit(row.dataset.id, {notes: act.value}, true);
});
repView.addEventListener("focusout", function(){
  if(listDirty) setTimeout(function(){ if(listDirty) renderRep(); }, 0);
});

function digitsOf(t){ return String(t||"").replace(/[^0-9]/g,""); }
function parseBulk(text){
  var mineList = leads.filter(function(l){ return l.owner===view; });
  var seenName = {}, seenPhone = {};
  mineList.forEach(function(l){
    if(l.name) seenName[l.name.trim().toLowerCase()] = true;
    if(l.phone) seenPhone[digitsOf(l.phone).slice(-10)] = true;
  });
  return text.split("\n").map(function(raw){
    var line = raw.replace(/^[\s•·\-–—]+/, "").trim();
    if(!line) return null;
    var parts = line.split(/\s*[,\t]\s*/);
    var name = (parts[0]||"").trim(), phone = (parts[1]||"").trim();
    var d = digitsOf(name);
    if(UI_WORDS.indexOf(line.toLowerCase()) >= 0)
      return {line:line, reason:"part of a copied row, not a name"};
    if(!/[a-z0-9]/i.test(line))
      return {line:line, reason:"no letters or numbers in it"};
    // a line that is only a phone number is a lead with no name, not junk
    if(!/[a-z]/i.test(name) && d.length >= 7){ phone = phone || name; name = ""; }
    else if(!/[a-z]/i.test(name))
      return {line:line, reason:"doesn’t look like a name"};
    var key = digitsOf(phone).slice(-10);
    if(name && seenName[name.toLowerCase()])
      return {line:line, reason:"already on your list"};
    if(key && seenPhone[key])
      return {line:line, reason:"that number is already on your list"};
    if(name) seenName[name.toLowerCase()] = true;
    if(key) seenPhone[key] = true;
    return {line:line, ok:true, name:name, phone:phone};
  }).filter(Boolean);
}
function bulkCheck(){
  var ta = document.getElementById("bulk");
  bulkText = ta ? ta.value : bulkText;
  var rows = parseBulk(bulkText);
  if(!rows.length){ toast("Paste some names first", true); return; }
  addPreview = rows;
  renderRep();
}
function bulkAdd(){
  var rows = (addPreview || []).filter(function(r){ return r.ok; });
  if(!rows.length){ toast("Nothing here to add", true); return; }
  var mineList = leads.filter(function(l){ return l.owner===view; });
  var rank = mineList.reduce(function(m,l){ return Math.max(m, l.rank||0); }, 0);
  var ownerId = mineList.length ? mineList[0].ownerId : "";
  var stamp = Date.now(), added = 0;
  rows.forEach(function(r, i){
    var name = r.name, phone = r.phone;
    rank++; added++;
    var id = "m" + stamp + "-" + i;
    var doc = blank({id:id, owner:view, ownerId:ownerId, rank:rank, name:name, phone:phone,
      bucket:"", assignedDate:today(), updatedAt:new Date().toISOString(), updatedBy:me});
    var body = Object.assign({}, doc); delete body.id;
    raw.set(id, doc);
    if(db) db.doc("leads/"+id).set(body).catch(function(){ toast("Couldn’t save new leads", true); });
    else localSave();
  });
  bulkText = ""; addPreview = null;
  document.getElementById("list").dataset.sig = "";
  rebuild();
  toast(added + (added===1?" lead added":" leads added"));
}

document.addEventListener("keydown", function(e){
  if(!(e.ctrlKey || e.metaKey) || e.shiftKey || String(e.key).toLowerCase() !== "z") return;
  var t = e.target;
  if(t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
  if(view === "dash" || view !== me) return;
  e.preventDefault();
  undoLast();
});
window.addEventListener("beforeunload", function(e){
  if(pending.size){ flush(); e.preventDefault(); e.returnValue = ""; }
});
setInterval(function(){ if(view==="dash") renderDash(); else if(!listDirty) renderRep(); }, 60000);

/* ---------------- boot ---------------- */
localLoad();
rebuild();

if(window.claude && typeof window.claude.use === "function"){
  window.claude.use("downloads").then(function(d){ downloads = d; }).catch(function(){});
  window.claude.use("db").then(function(store){
    if(!store){ localOnly = true; setSync(); noteLocal(); return; }
    db = store;
    db.doc("meta/coverage").onSnapshot(function(snap){
      coverage = (snap.exists && snap.data()) ? snap.data() : {};
      delete coverage.id;
      rebuild();
    }, function(){ /* coverage is optional; without it everyone just works their own list */ });
    db.collection("leads").limit(1000).onSnapshot(function(snap){
      dbReady = true; sawData = true;
      var next = new Map();
      snap.docs.forEach(function(d){ next.set(d.id, Object.assign({id:d.id}, d.data())); });
      pending.forEach(function(patch, id){
        if(next.has(id)) next.set(id, Object.assign({}, next.get(id), patch));
      });
      raw = next;
      rebuild();
    }, function(err){
      dbReady = false;
      if(err && err.code === "revoked"){ localOnly = true; noteLocal(); }
      toast("Live sync stopped — reload to reconnect", true);
      setSync();
    });
    setTimeout(function(){ if(!sawData){ dbReady = true; setSync(); } }, 4000);
  }).catch(function(){ localOnly = true; setSync(); noteLocal(); });
} else {
  localOnly = true; setSync(); noteLocal();
}
function noteLocal(){
  toast("Not connected to the shared tracker — changes stay on this device", true);
}
})();
</script>
